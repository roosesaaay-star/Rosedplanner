<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>VANTA•9 Trading Terminal</title>

  <style>

    :root {
      --bg: #05070b;
      --panel: #0c1119;
      --panel2: #101722;
      --line: #1d2736;

      --text: #edf3fb;
      --muted: #8290a5;

      --green: #35e29a;
      --red: #ff5570;
      --amber: #ffc857;
      --blue: #62a8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background:
        radial-gradient(
          circle at 20% 0%,
          #132039 0,
          #05070b 45%
        );

      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .wrap {
      max-width: 1500px;
      margin: auto;
      padding: 24px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 22px;
    }

    .brand {
      font-size: 30px;
      font-weight: 900;

      letter-spacing: .08em;
    }

    .sub {
      color: var(--muted);
      margin-top: 5px;
    }

    .status {
      border: 1px solid var(--line);

      padding: 10px 15px;

      border-radius: 999px;

      background: #090d14;
    }

    .dot {
      display: inline-block;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--green);

      margin-right: 7px;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;
    }

    .card {
      background:
        linear-gradient(
          145deg,
          #101722,
          #090d14
        );

      border: 1px solid var(--line);

      border-radius: 18px;

      padding: 18px;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.25);
    }

    .pairhead {
      display: flex;

      justify-content:
        space-between;

      align-items: center;
    }

    .pair {
      font-weight: 900;
      font-size: 19px;
    }

    .badge {
      padding: 6px 11px;

      border-radius: 9px;

      font-size: 11px;

      font-weight: 900;
    }

    .BUY {
      background: #123c2e;
      color: var(--green);
    }

    .SELL {
      background: #421927;
      color: var(--red);
    }

    .WAIT {
      background: #302816;
      color: var(--amber);
    }

    .OFFLINE {
      background: #282d35;
      color: #aab4c3;
    }

    .price {
      font-size: 32px;

      font-weight: 900;

      margin:
        18px 0 3px;
    }

    .muted {
      color: var(--muted);
    }

    .score {
      font-size: 14px;
    }

    .bar {
      height: 7px;

      background: #1a2230;

      border-radius: 20px;

      margin:
        9px 0 16px;

      overflow: hidden;
    }

    .fill {
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--amber),
          var(--green)
        );
    }

    .metrics {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;
    }

    .metric {
      background: #090d14;

      border: 1px solid #182130;

      padding: 11px;

      border-radius: 12px;
    }

    .metric b {
      display: block;

      margin-top: 5px;
    }

    .section {
      margin-top: 19px;
    }

    .section h2 {
      font-size: 16px;

      margin:
        0 0 10px;
    }

    .tfgrid {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 9px;
    }

    .tf {
      background: #090d14;

      border: 1px solid #182130;

      border-radius: 12px;

      padding: 11px;
    }

    .tf strong {
      display: block;

      margin-bottom: 8px;
    }

    .green {
      color: var(--green);
    }

    .red {
      color: var(--red);
    }

    .amber {
      color: var(--amber);
    }

    table {
      width: 100%;

      border-collapse:
        collapse;
    }

    td,
    th {
      padding: 10px;

      border-bottom:
        1px solid #182130;

      text-align: left;
    }

    th {
      color: var(--muted);

      font-weight: 600;
    }

    .checks {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;
    }

    .check {
      padding: 12px;

      border-radius: 12px;

      background: #090d14;

      border: 1px solid #182130;
    }

    .check.pass {
      border-color: #1d5b45;
    }

    .check.fail {
      border-color: #5b2230;
    }

    .check b {
      display: block;

      margin-bottom: 5px;
    }

    .plan {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;
    }

    .plan strong {
      font-size: 17px;

      display: block;

      margin-top: 5px;
    }

    .footer {
      text-align: center;

      color: var(--muted);

      padding: 28px 10px;
    }

    @media (max-width: 1000px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .checks {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .tfgrid {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

    @media (max-width: 650px) {

      .wrap {
        padding: 14px;
      }

      .top {
        flex-direction: column;

        align-items:
          flex-start;
      }

      .metrics {
        grid-template-columns:
          1fr;
      }

      .tfgrid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .checks {
        grid-template-columns: 1fr;
      }

      .plan {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

  </style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div>

      <div class="brand">
        VANTA•9
      </div>

      <div class="sub">
        Strict Multi-Timeframe SMC Terminal
        · USDCAD · EURCHF · XAUUSD
      </div>

    </div>

    <div class="status">

      <span class="dot"></span>

      <span id="system">
        Connecting...
      </span>

    </div>

  </div>

  <div
    id="cards"
    class="grid"
  ></div>

  <div class="footer">
    9-point confirmation · WAIT is allowed ·
    Signals are rule-based and require independent risk management.
  </div>

</div>

<script>

const $ = id =>
  document.getElementById(id);

function formatPrice(
  value,
  decimals
) {
  if (
    value === null ||
    value === undefined
  ) {
    return "—";
  }

  return Number(value)
    .toFixed(decimals);
}

function trendClass(
  value
) {
  const text =
    String(value || "");

  if (
    text.includes("BULL")
  ) {
    return "green";
  }

  if (
    text.includes("BEAR")
  ) {
    return "red";
  }

  return "amber";
}

function renderPair(
  name,
  pair
) {

  if (
    !pair ||
    pair.result === "OFFLINE"
  ) {

    return `
      <div class="card">

        <div class="pairhead">

          <span class="pair">
            ${name}
          </span>

          <span class="badge OFFLINE">
            OFFLINE
          </span>

        </div>

        <div class="price">
          —
        </div>

        <div class="muted">
          ${pair?.error ||
            "Waiting for market data..."}
        </div>

      </div>
    `;
  }

  const decimals =
    name === "XAUUSD"
      ? 2
      : 5;

  const checks =
    (pair.checks || [])
      .map(check => {

        const passed =
          pair.result === "BUY"
            ? check.buy
            : pair.result === "SELL"
            ? check.sell
            : (
                check.buy ||
                check.sell
              );

        return `
          <div class="check ${
            passed
              ? "pass"
              : "fail"
          }">

            <b>
              ${passed ? "✓" : "×"}
              ${check.name}
            </b>

            <span class="muted">
              ${check.detail || ""}
            </span>

          </div>
        `;

      })
      .join("");

  const timeframes =
    [
      "12h",
      "4h",
      "1h",
      "15min",
      "5min"
    ]
      .map(tf => {

        const t =
          pair.timeframes?.[tf];

        return `
          <div class="tf">

            <strong>
              ${tf.toUpperCase()}
            </strong>

            <span class="${
              trendClass(t?.trend)
            }">

              ${t?.trend || "—"}

            </span>

            <br>

            <span class="muted">

              RSI:
              ${t?.rsi ?? "—"}

              · EMA20:
              ${formatPrice(
                t?.ema20,
                decimals
              )}

            </span>

          </div>
        `;

      })
      .join("");

  return `

    <div class="card">

      <div class="pairhead">

        <span class="pair">
          ${name}
        </span>

        <span class="badge ${pair.result}">
          ${pair.result}
        </span>

      </div>

      <div class="price">

        ${formatPrice(
          pair.lastPrice,
          decimals
        )}

      </div>

      <div class="score">

        ${pair.grade || "WAIT"}

        · Confidence
        ${pair.confidence || 0}%

        · Score
        ${pair.score || 0}/9

      </div>

      <div class="bar">

        <div
          class="fill"
          style="
            width:${pair.confidence || 0}%
          "
        ></div>

      </div>

      <div class="metrics">

        <div class="metric">

          Liquidity

          <b>
            ${pair.liquidity || "—"}
          </b>

        </div>

        <div class="metric">

          FVG

          <b>
            ${pair.fvg?.type || "NONE"}
          </b>

        </div>

        <div class="metric">

          Structure

          <b>
            ${pair.structure || "—"}
          </b>

        </div>

      </div>

      <div class="section">

        <h2>
          Top-Down Analysis
        </h2>

        <div class="tfgrid">
          ${timeframes}
        </div>

      </div>

      <div class="section">

        <h2>
          Technical Analysis
        </h2>

        <table>

          <tr>
            <th>Metric</th>
            <th>5M</th>
            <th>15M</th>
            <th>1H</th>
          </tr>

          <tr>

            <td>
              Trend
            </td>

            <td>
              ${pair.timeframes?.["5min"]?.trend || "—"}
            </td>

            <td>
              ${pair.timeframes?.["15min"]?.trend || "—"}
            </td>

            <td>
              ${pair.timeframes?.["1h"]?.trend || "—"}
            </td>

          </tr>

          <tr>

            <td>
              RSI
            </td>

            <td>
              ${pair.timeframes?.["5min"]?.rsi ?? "—"}
            </td>

            <td>
              ${pair.timeframes?.["15min"]?.rsi ?? "—"}
            </td>

            <td>
              ${pair.timeframes?.["1h"]?.rsi ?? "—"}
            </td>

          </tr>

          <tr>

            <td>
              ATR
            </td>

            <td>
              ${formatPrice(
                pair.timeframes?.["5min"]?.atr,
                decimals
              )}
            </td>

            <td>
              ${formatPrice(
                pair.timeframes?.["15min"]?.atr,
                decimals
              )}
            </td>

            <td>
              ${formatPrice(
                pair.timeframes?.["1h"]?.atr,
                decimals
              )}
            </td>

          </tr>

        </table>

      </div>

      <div class="section">

        <h2>
          9-Point Confirmation
        </h2>

        <div class="checks">

          ${checks}

        </div>

      </div>

      <div class="section">

        <h2>
          Trade Plan
        </h2>

        <div class="plan">

          <div class="metric">

            Entry

            <strong>
              ${formatPrice(
                pair.entry,
                decimals
              )}
            </strong>

          </div>

          <div class="metric">

            Stop Loss

            <strong>
              ${formatPrice(
                pair.stopLoss,
                decimals
              )}
            </strong>

          </div>

          <div class="metric">

            Take Profit

            <strong>
              ${formatPrice(
                pair.takeProfit,
                decimals
              )}
            </strong>

          </div>

          <div class="metric">

            R:R

            <strong>
              1:${pair.rr ?? "—"}
            </strong>

          </div>

        </div>

      </div>

    </div>

  `;
}

async function loadDashboard() {

  try {

    const response =
      await fetch(
        "/api/status",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    $("system").textContent =
      data.scanning
        ? "Scanning..."
        : (
            "LIVE · " +
            (
              data.updatedAt
                ? new Date(
                    data.updatedAt
                  ).toLocaleTimeString()
                : "—"
            )
          );

    $("cards").innerHTML =
      (
        data.instruments || []
      )
        .map(name =>
          renderPair(
            name,
            data.pairs?.[name]
          )
        )
        .join("");

  } catch (error) {

    $("system").textContent =
      "Connection Error";

  }

}

loadDashboard();

setInterval(
  loadDashboard,
  15000
);

</script>

</body>
</html>
